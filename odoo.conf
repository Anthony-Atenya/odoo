[options]
; --- Security ---
; Master (database manager) password: passed at runtime as --admin-passwd
list_db = False
dbfilter = ^%d$

; --- Networking ---
; We'll override the HTTP port with --http-port=$PORT at runtime
proxy_mode = True

; --- Addons ---
addons_path = /mnt/extra-addons,/usr/lib/python3/dist-packages/odoo/addons
server_wide_modules = web

; --- Performance for Render Free ---
; Keep to single-process threaded mode to save RAM and avoid extra ports
workers = 0
max_cron_threads = 1

; Soft/Hard memory & time limits (tuned for 512 MB plan)
limit_memory_soft = 268435456       ; 256 MB
limit_memory_hard = 322122547       ; ~307 MB
limit_time_cpu = 600
limit_time_real = 1200

; Keep Postgres connections conservative (Render Free has 100-conn cap)
; (1 + workers + max_cron_threads) * db_maxconn < Postgres max_connections
db_maxconn = 4

; --- Logging ---
log_level = info
logfile = /dev/stdout
